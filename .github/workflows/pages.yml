name: Website – Build and Publish to GitHub Pages

# The public site: site/ plus the in-app help pages, built by scripts/build-site.py. It follows
# releases, so it's published from master; run it by hand to republish.
on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - 'booklore-ui/public/docs/**'
      - 'assets/brand/trove/**'
      - 'scripts/build-site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0  # tags for the version, history for each page's last-changed date

      - name: Build Site
        run: python3 -I scripts/build-site.py --out _site

      - name: Upload Site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
