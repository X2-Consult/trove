app:
  path-config: '/app/data'
  bookdrop-folder: '/bookdrop'
  # Release builds (CI) rewrite this literal with the git tag via yq. Native installs
  # leave the literal in place and pass the real version through APP_VERSION instead.
  version: ${APP_VERSION:development}
  # Checkout used by the in-app updater. Unset, it's worked out from the working directory (see
  # SystemUpdateService.repoDir). BOOKLORE_* names are read as fallbacks for installs from before the rename.
  repo-dir: ${TROVE_REPO_DIR:${BOOKLORE_REPO_DIR:}}

  cors:
    # Comma-separated list of allowed CORS origins.
    # Leave empty (default) to allow same-origin requests only.
    # Example: ALLOWED_ORIGINS=https://app.example.com,https://mobile.example.com
    allowed-origins: ${ALLOWED_ORIGINS:*}

  remote-auth:
    enabled: ${REMOTE_AUTH_ENABLED:false}
    create-new-users: ${REMOTE_AUTH_CREATE_NEW_USERS:true}
    header-name: ${REMOTE_AUTH_HEADER_NAME:Remote-Name}
    header-user: ${REMOTE_AUTH_HEADER_USER:Remote-User}
    header-email: ${REMOTE_AUTH_HEADER_EMAIL:Remote-Email}
    header-groups: ${REMOTE_AUTH_HEADER_GROUPS:Remote-Groups}
    admin-group: ${REMOTE_AUTH_ADMIN_GROUP}
    groups-delimiter: ${REMOTE_AUTH_GROUPS_DELIMITER:\\s+}
  force-disable-oidc: ${FORCE_DISABLE_OIDC:false}
  disk-type: ${DISK_TYPE:LOCAL}
  # Library folders on network shares (NFS, SMB) are checked for changes this often, since shares
  # don't send change notifications for files added from other machines.
  network-poll-seconds: ${NETWORK_POLL_SECONDS:60}
  # Cover and author-photo downloads from user-supplied URLs refuse to connect into these ranges
  # (checked on every hop, redirects included), so such a URL can't reach this server or the LAN.
  # Other outbound calls (metadata providers, OIDC, Kobo) are not filtered. List from Grimmory.
  outbound:
    connect-timeout: 15
    read-timeout: 15
    restricted-ranges:
      - "0.0.0.0/8"          # "This host on this network" - RFC 6890
      - "10.0.0.0/8"         # Private use - RFC 1918
      - "100::/64"           # IPv6 discard prefix - RFC 6666
      - "100.64.0.0/10"      # Shared address space (CGNAT) - RFC 6890
      - "::1/128"            # IPv6 loopback - RFC 4291
      - "127.0.0.0/8"        # Loopback - RFC 6890
      - "::/128"             # IPv6 unspecified - RFC 4291
      - "169.254.0.0/16"     # Link local, incl. cloud metadata endpoints - RFC 6890
      - "172.16.0.0/12"      # Private use - RFC 6890
      - "192.0.0.0/24"       # IETF protocol assignments - RFC 6890
      - "192.0.2.0/24"       # TEST-NET-1 - RFC 5737
      - "192.168.0.0/16"     # Private use - RFC 6890
      - "192.88.99.0/24"     # 6to4 relay anycast - RFC 3068
      - "198.18.0.0/15"      # Benchmark testing - RFC 2544
      - "198.51.100.0/24"    # TEST-NET-2 - RFC 5737
      - "2001:10::/28"       # IPv6 ORCHID - RFC 7343
      - "2001::/23"          # IPv6 IETF protocol assignments - RFC 2928
      - "2001:db8::/32"      # IPv6 documentation - RFC 3849
      - "2002::/16"          # 6to4 - RFC 3056
      - "203.0.113.0/24"     # TEST-NET-3 - RFC 5737
      - "240.0.0.0/4"        # Reserved - RFC 6890
      - "255.255.255.255/32" # Limited broadcast - RFC 919
      - "64:ff9b:1::/48"     # Local-use IPv4/IPv6 translation - RFC 8215
      - "64:ff9b::/96"       # IPv4/IPv6 translators - RFC 6052
      - "fc00::/7"           # IPv6 unique local - RFC 4193
      - "fe80::/10"          # IPv6 link local - RFC 4291
  metadata-browser:
    # Load Amazon/GoodReads pages in headless Chromium (installed on first use) instead of plain HTTP.
    enabled: ${METADATA_BROWSER_ENABLED:true}

server:
  max-http-header-size: 128KB
  forward-headers-strategy: native
  port: ${TROVE_PORT:${BOOKLORE_PORT:6060}}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml,application/xml,application/atom+xml
    min-response-size: 1024
  tomcat:
    relaxed-query-chars: '[,],%,{,},|'

spring:
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  servlet:
    multipart:
      enabled: false
  mvc:
    async:
      request-timeout: 600000
  application:
    name: trove
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:${DB_HOST:postgres}}:${DATABASE_PORT:5432}/${DATABASE_NAME:trove}}
    username: ${DATABASE_USERNAME:trove}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD}}
    hikari:
      pool-name: TroveHikariPool
      max-lifetime: 580000         # 9.6 minutes (avoid DB-side connection cuts)
      connection-test-query: SELECT 1
      connection-timeout: 30000    # 30s to acquire a connection before timeout
      maximum-pool-size: 20        # Higher ceiling for virtual-thread bursts
      minimum-idle: 5              # Keep warm connections ready
      idle-timeout: 300000         # 5 minutes before idle connections are closed
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        query:
          timeout: 30              # 30s max for any HQL/JPQL query
        jdbc:
          time_zone: UTC
          batch_size: 500
          order_inserts: true
          order_updates: true
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  # Also written to a file, rotated and capped, so Settings > Server Logs can show it (and it survives
  # restarts); the console output still goes to the journal / docker logs as before.
  file:
    name: ${LOG_FILE:${app.path-config}/logs/trove.log}
  pattern:
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%t] %logger{40} : %m%n%wEx"
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE:${app.path-config}/logs/trove.log}.%d{yyyy-MM-dd}.%i.gz"
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    org.booklore: ${LOG_LEVEL:INFO}
    org.apache.fontbox: ERROR
    org.apache.pdfbox: ERROR
    org.quartz.core.QuartzScheduler: WARN
    org.quartz.simpl.SimpleThreadPool: WARN
    org.quartz.simpl.RAMJobStore: WARN
    org.hibernate.orm.connections.pooling: WARN
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
